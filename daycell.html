<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111313">
<title>Daycell</title>
<meta name="description" content="A notebook-style journal that's just a markdown file. No account, no cloud, no subscription.">
<meta name="author" content="Dip Raiyan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ebeae5;
  --grid: #d9d7d0;
  --chrome: #f3f2ee;
  --surface: #f9f8f5;
  --code: #f1f0ec;
  --border: #d5d3cb;
  --border-strong: #b8b5ab;
  --text: #1d1e1b;
  --muted: #474a44;
  --faint: #62655e;
  --accent: #0a6f62;
  --accent-soft: rgba(10, 111, 98, .1);
  --amber: #9a5806;
  --danger: #b42318;
  --danger-soft: rgba(180, 35, 24, .08);
  --ok: #137a3a;
  /* light mode is off-white paper, never pure white: body text ~16:1, secondary 7:1+, faint 4.5:1+ */
  --dot: #d3d1c9;
  --lift: 0 1px 2px rgba(40, 36, 24, .06);
  --mono-w: 450;  /* dark text on light reads thinner, so mono gets a touch more weight */
  --r-s: 6px;
  --r-l: 10px;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --sans: "Inter", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e0e; --grid: #1a1c1c; --chrome: #111313; --surface: #151717; --code: #101212;
    --border: #232626; --border-strong: #343838; --text: #e6e7e3; --muted: #a0a49d; --faint: #82867f;
    --accent: #3fc8b2; --accent-soft: rgba(63, 200, 178, .11); --amber: #f2b13c;
    --danger: #f4846b; --danger-soft: rgba(244, 132, 107, .12); --ok: #5bd18b;
    --dot: #1d1f1f; --lift: none; --mono-w: 400;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e0e; --grid: #1a1c1c; --chrome: #111313; --surface: #151717; --code: #101212;
  --border: #232626; --border-strong: #343838; --text: #e6e7e3; --muted: #a0a49d; --faint: #82867f;
  --accent: #3fc8b2; --accent-soft: rgba(63, 200, 178, .11); --amber: #f2b13c;
  --danger: #f4846b; --danger-soft: rgba(244, 132, 107, .12); --ok: #5bd18b;
  --dot: #1d1f1f; --lift: none; --mono-w: 400;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .35; }
svg { display: block; flex: none; }
.mono { font-family: var(--mono); }
kbd { font: 500 10.5px var(--mono); padding: 1px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); }

.shell { display: grid; grid-template-rows: 44px minmax(0, 1fr) calc(26px + env(safe-area-inset-bottom)); height: 100vh; height: 100dvh; }

/* ---------- menubar ---------- */
.menubar { display: flex; align-items: center; gap: 14px; padding: 0 12px 0 0; background: var(--chrome); border-bottom: 1px solid var(--border); }
.logo { width: 48px; height: 44px; display: grid; place-items: center; border-right: 1px solid var(--border); }
.logo span { width: 20px; height: 20px; border-radius: 5px; background: var(--text); color: var(--chrome); display: grid; place-items: center; font: 600 11px var(--mono); }
.wordmark { font: 600 13px var(--mono); letter-spacing: -.02em; }
.wordmark i { font-style: normal; color: var(--faint); font-weight: 400; }
.filetab { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-s); font: var(--mono-w) 12px var(--mono); color: var(--muted); max-width: 40vw; }
.filetab b { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filetab .mod { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); display: none; }
.filetab.unsaved .mod { display: block; }
.grow { flex: 1; }
.kernel { display: flex; align-items: center; gap: 8px; font: var(--mono-w) 12px var(--mono); color: var(--muted); }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 3px transparent; }
.kernel.ok .led { background: var(--ok); }
.kernel.busy .led { background: var(--amber); animation: pulse 1s infinite; }
.kernel.warn .led { background: var(--amber); }
.kernel.err .led { background: var(--danger); }
@keyframes pulse { 50% { opacity: .3; } }
.ib { width: 30px; height: 30px; border-radius: var(--r-s); display: grid; place-items: center; color: var(--muted); position: relative; transition: background .12s, color .12s, transform .08s; }
.ib:active:not(:disabled), .btn:active:not(:disabled) { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible { outline: none; }
.ib:hover:not(:disabled) { background: var(--grid); color: var(--text); }
.ib.danger:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }

/* ---------- workspace ---------- */
.work { display: grid; grid-template-columns: 48px auto minmax(0, 1fr); min-height: 0; }
.rail { grid-column: 1; }
.panel { grid-column: 2; }
main { grid-column: 3; }
.rail { background: var(--chrome); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
.rail .ib { width: 36px; height: 36px; }
.rail .ib.active { color: var(--text); }
.rail .ib.active::before { content: ""; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); }
.badge { position: absolute; top: 3px; right: 2px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font: 600 9.5px/15px var(--mono); text-align: center; }

.panel { width: 280px; background: var(--chrome); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.panel[hidden] { display: none; }
.p-head { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px 0 14px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); flex: none; }
.p-filter { margin: 10px 10px 4px; display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 32px; border: 1px solid var(--border); border-radius: var(--r-s); background: var(--surface); color: var(--faint); }
.p-filter:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.p-filter input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 12px var(--mono); color: var(--text); }
.p-body { flex: 1; overflow-y: auto; padding: 4px 6px 16px; }
.p-group { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 14px 8px 4px; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; }
.row:hover { background: var(--grid); }
.row.active { background: var(--accent-soft); }
.row .n { font: 11px var(--mono); color: var(--faint); }
.row.active .n { color: var(--accent); }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.row .d { font: 11px var(--mono); color: var(--faint); }
.p-empty { padding: 28px 14px; text-align: center; font: 12px var(--mono); color: var(--faint); line-height: 1.7; }
.p-note { margin: 14px 8px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-s); font: 11px/1.6 var(--mono); color: var(--muted); }

.trow { padding: 10px 8px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.trow .tt { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .tm { font: 11px var(--mono); color: var(--faint); grid-column: 1; }
.trow .ta { grid-row: 1 / 3; grid-column: 2; display: flex; gap: 2px; }
.btn { transition: background .12s, color .12s, border-color .12s, transform .08s; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--border); font: 500 11.5px var(--mono); background: var(--surface); }
.btn:hover:not(:disabled) { border-color: var(--border-strong); }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--chrome); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--grid); }
.btn.block { width: 100%; justify-content: flex-start; height: 34px; }
.stack { display: grid; gap: 6px; padding: 10px 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 4px 8px; font: 11.5px var(--mono); }
.kv span:nth-child(odd) { color: var(--text); }
.kv span:nth-child(even) { color: var(--muted); }
.fmt { margin: 6px 8px; padding: 10px 12px; background: var(--code); border: 1px solid var(--border); border-radius: var(--r-s); font: 11px/1.65 var(--mono); color: var(--muted); white-space: pre; overflow-x: auto; }
.fmt b { color: var(--accent); font-weight: 500; }

/* ---------- notebook ---------- */
main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 10px; background: var(--chrome); border-bottom: 1px solid var(--border); flex: none; }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
.mode { font: 600 11px var(--mono); letter-spacing: .08em; padding: 4px 9px; border-radius: 5px; background: var(--grid); color: var(--muted); }
.mode.edit { background: var(--accent-soft); color: var(--accent); }
.nb { flex: 1; overflow-y: auto; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 24px 24px; }
.cells { max-width: 880px; margin: 0 auto; padding: 28px 28px 40vh 12px; }

.banner { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 0 0 18px 64px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); background: color-mix(in srgb, var(--amber) 9%, var(--surface)); border-radius: 8px; font: 12px var(--mono); }

.cell { display: grid; grid-template-columns: 64px 1fr; margin-bottom: 12px; }
.prompt { font: var(--mono-w) 12px var(--mono); color: var(--faint); text-align: right; padding: 13px 12px 0 0; user-select: none; font-variant-numeric: tabular-nums; transition: color .2s; }
.cell.selected .prompt { color: var(--accent); }
.cell.editing .prompt { color: var(--amber); }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-l); min-width: 0; box-shadow: var(--lift); transition: border-color .16s ease, box-shadow .16s ease; position: relative; }
.cell:hover .box { border-color: var(--border-strong); }
.cell.selected .box { border-color: var(--border-strong); box-shadow: inset 2px 0 0 var(--accent), var(--lift); }
.cell.editing .box { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px; padding: 6px 8px 0 18px; font: var(--mono-w) 12px var(--mono); color: var(--muted); }
.head .ts { font-variant-numeric: tabular-nums; }
.head .ts b { font-weight: 550; color: var(--text); }
.meter { display: inline-flex; align-items: center; gap: 2px; }
.meter i { width: 4px; height: 10px; border-radius: 1px; background: var(--border-strong); }
.meter i.on { background: var(--text); opacity: .75; }
.meter em { font-style: normal; margin-left: 6px; }
.tag { color: var(--muted); }
.actions { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.cell:hover .actions, .cell.selected .actions, .cell.editing .actions { opacity: 1; }

.md { padding: 2px 18px 16px; font-size: 14.5px; font-weight: 420; line-height: 1.68; overflow-wrap: anywhere; cursor: text; }
.md .title { font-size: 18px; font-weight: 600; letter-spacing: -.015em; margin: 4px 0 6px; }
.md .title.untitled { color: var(--faint); font-weight: 500; }
.md p { margin: 0 0 10px; }
.md h3, .md h4, .md h5, .md h6 { font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md li.task { list-style: none; margin-left: -20px; display: flex; gap: 8px; align-items: baseline; }
.md .cb { width: 11px; height: 11px; border: 1.5px solid var(--border-strong); border-radius: 3px; flex: none; transform: translateY(1px); }
.md .cb.on { background: var(--accent); border-color: var(--accent); }
.md code { font: 12.5px var(--mono); background: var(--code); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--code); border: 1px solid var(--border); border-radius: var(--r-s); padding: 10px 12px; overflow-x: auto; margin: 0 0 10px; }
.md pre code { border: 0; padding: 0; background: none; }
.md blockquote { margin: 0 0 10px; padding: 2px 14px; border-left: 2px solid var(--accent); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
.md a { color: var(--accent); }
.md > :last-child { margin-bottom: 0; }

.ed { padding: 4px 18px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.f-title { border: 0; outline: none; background: transparent; font-size: 18px; font-weight: 600; letter-spacing: -.015em; padding: 4px 0; }
.f-title::placeholder, .f-body::placeholder, .f-tags::placeholder { color: var(--faint); }
.f-date, .f-time { border: 1px solid transparent; border-radius: 5px; background: transparent; font: 11.5px var(--mono); color: var(--text); padding: 2px 4px; outline: none; }
.f-date:hover, .f-time:hover, .f-date:focus, .f-time:focus { border-color: var(--border); }
.moodseg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-s); overflow-x: auto; width: max-content; max-width: 100%; scrollbar-width: none; }
.moodseg button { white-space: nowrap; }
.moodseg button { display: flex; align-items: center; gap: 6px; padding: 5px 11px; font: 11.5px var(--mono); color: var(--muted); border-right: 1px solid var(--border); }
.moodseg button:last-child { border-right: 0; }
.moodseg button:hover { background: var(--grid); color: var(--text); }
.moodseg button.on { background: var(--accent-soft); color: var(--accent); }
.moodseg .lbl { padding: 5px 10px; font: 11px var(--mono); color: var(--faint); border-right: 1px solid var(--border); }
.f-body { width: 100%; min-height: 150px; resize: none; overflow: hidden; outline: none; border: 1px solid var(--border); border-radius: var(--r-s); background: var(--code); padding: 12px 14px; font: 13px/1.75 var(--mono); tab-size: 2; }
.f-body:focus { border-color: var(--border-strong); }
.f-tags { border: 0; outline: none; background: transparent; font: 12px var(--mono); color: var(--accent); padding: 2px 0; }
.ed-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 10px; font: 11px var(--mono); color: var(--faint); }
.ed-foot .hint { display: flex; align-items: center; gap: 5px; }

.empty-nb { margin: 12vh auto 0; max-width: 420px; text-align: center; font: 12.5px/1.9 var(--mono); color: var(--muted); }
.empty-nb .big { font-size: 13px; color: var(--text); margin-bottom: 8px; }
.add-cell { display: flex; align-items: center; gap: 8px; margin: 6px 0 0 64px; width: calc(100% - 64px); height: 38px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--r-l); background: color-mix(in srgb, var(--surface) 60%, transparent); font: var(--mono-w) 12px var(--mono); color: var(--muted); transition: border-color .16s, color .16s, background .16s; }
.add-cell:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface); }

/* ---------- status bar ---------- */
.statusbar { font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 18px; padding: 0 max(14px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px, env(safe-area-inset-left)); background: var(--chrome); border-top: 1px solid var(--border); font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
.statusbar b { font-weight: 500; color: var(--text); }

/* ---------- toast + modal ---------- */
.toast { position: fixed; left: 50%; bottom: 42px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 14px; padding: 9px 10px 9px 16px; background: var(--text); color: var(--chrome); border-radius: var(--r-l); font: 12px var(--mono); transition: opacity .18s ease, transform .32s cubic-bezier(.2, 1.4, .4, 1); z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { font: 600 11.5px var(--mono); color: var(--accent); padding: 4px 8px; border-radius: 5px; }
.toast button:hover { background: rgba(127,127,127,.2); }
.toast:not(.has-action) button { display: none; }

.modal { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal[hidden] { display: none; }
.dialog { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
.dialog h3 { margin: 0; padding: 16px 18px 6px; font: 600 13px var(--mono); }
.dialog p { margin: 0; padding: 0 18px 18px; color: var(--muted); font-size: 13.5px; }
.dialog .d-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--code); }

/* ---------- status cell [0] ---------- */
.cell.status .box { background: transparent; border-style: dashed; box-shadow: none; }
.cell.status:hover .box { border-color: var(--border-strong); }
.code-line { display: flex; align-items: center; gap: 10px; min-height: 22px; padding: 10px 92px 0 18px; font: var(--mono-w) 12.5px var(--mono); color: var(--muted); }
.code-line .fn { color: var(--accent); }
.out { padding: 6px 18px 14px; font: var(--mono-w) 12.5px/1.85 var(--mono); }
.out .k { color: var(--faint); display: inline-block; min-width: 84px; margin-right: 10px; }
.out .hi { color: var(--text); font-weight: 550; }
.out .hi::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 2px; }
.out .q { color: var(--text); }
.out .lnk { color: var(--text); border-bottom: 1px dashed var(--faint); }
.out .lnk:hover { color: var(--accent); border-color: var(--accent); }
.out .acts { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: middle; }
.out .btn { height: 24px; padding: 0 9px; font-size: 11px; }
.out .btn.primary { background: transparent; color: var(--text); border-color: var(--border-strong); }
.out .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--chrome); }
.prompt-line { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--r-s); font: 12px var(--mono); color: var(--muted); }
.prompt-line b { color: var(--accent); font-weight: 500; }
.prompt-line .ptext { flex: 1; color: var(--text); }
.prompt-line .btn { height: 24px; padding: 0 9px; font-size: 11px; }

/* ---------- insights panel ---------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 8px 4px; }
.stat { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.stat b { display: block; font: 600 18px var(--mono); letter-spacing: -.02em; }
.stat span { font: 10.5px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
.stat.hot b { color: var(--accent); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); gap: 2px; padding: 6px 8px 2px; }
.heat i { width: 9px; height: 9px; border-radius: 2px; background: var(--grid); cursor: default; }
.heat i[data-date] { cursor: pointer; }
.heat i.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--grid)); }
.heat i.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--grid)); }
.heat i.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--grid)); }
.heat i.l4 { background: var(--accent); }
.heat i.today { outline: 1px solid var(--text); outline-offset: 1px; }
.heat i.pad { visibility: hidden; }
.heat-legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; padding: 4px 10px 0; font: 10px var(--mono); color: var(--faint); }
.heat-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 44px; padding: 6px 10px 0; }
.bars i { flex: 1; border-radius: 2px 2px 0 0; background: var(--accent); opacity: .75; min-height: 3px; }
.bars i.none { background: var(--border); opacity: 1; }
.taglist { padding: 4px 8px; display: grid; gap: 4px; }
.taglist div { display: grid; grid-template-columns: 1fr auto; gap: 8px; font: 11.5px var(--mono); align-items: center; }
.taglist .tbar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--grid); overflow: hidden; }
.taglist .tbar i { display: block; height: 100%; background: var(--accent); }

/* ---------- web: start screen, eject ---------- */
.eject-card { position: fixed; left: 50%; top: 40%; z-index: 70; display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); color: var(--accent); font: 12px var(--mono); pointer-events: none; animation: eject 1.8s cubic-bezier(.5, 0, .3, 1) forwards; }
.eject-card div { display: grid; gap: 2px; }
.eject-card b { color: var(--text); font-weight: 600; font-size: 13px; }
.eject-card span { color: var(--muted); }
@keyframes eject {
  0% { transform: translate(-50%, 20px) scale(.96); opacity: 0; }
  18% { transform: translate(-50%, 0) scale(1); opacity: 1; }
  55% { transform: translate(-50%, 0) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -46vh) scale(.82); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .eject-card { animation-duration: .01s; } }
.m-input { display: flex; align-items: center; margin: 0 18px 18px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--code); padding: 0 12px; font: 13px var(--mono); color: var(--faint); }
.m-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.m-input[hidden] { display: none; }
.m-input input { flex: 1; min-width: 0; height: 38px; border: 0; outline: none; background: transparent; font: 14px var(--mono); color: var(--text); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border-strong); }
.swatch.on { box-shadow: 0 0 0 2px var(--text); }
.p-group .seg { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--faint); padding: 0 3px; border-radius: 3px; }
.p-group .seg.on { color: var(--accent); }
.heat-scroll { overflow-x: auto; scrollbar-width: thin; }
.heat-scroll .heat { width: max-content; }
#filetab { cursor: pointer; }
#filetab:hover { border-color: var(--border-strong); }
@media (hover: none) and (pointer: coarse) { .m-input input { font-size: 16px; } }

/* ---------- start screen: the first screen is already a notebook ---------- */
.start { max-width: 660px; margin: 8vh auto 0; }
.start .lead .box { background: transparent; border-style: dashed; box-shadow: none; padding: 12px 18px 16px; }
.start .lead .code-line { padding: 0; }
.start h1 { margin: 8px 0 4px; font: 600 28px var(--mono); letter-spacing: -.03em; }
.start h1 span { color: var(--faint); font-weight: 400; }
.start-sub { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
.caret { display: inline-block; width: 8px; height: 15px; margin-left: 4px; vertical-align: -2px; background: var(--accent); opacity: .75; animation: caret 1.1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.start-opt { width: 100%; text-align: left; }
.start-opt .box { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 15px 18px; }
.start-opt .box svg { color: var(--muted); }
.start-opt b { display: block; font: 600 13px var(--mono); color: var(--text); }
.start-opt .t span { font-size: 13px; color: var(--muted); }
.start-opt .go { font: var(--mono-w) 12px var(--mono); color: var(--faint); transition: transform .16s, color .16s; }
.start-opt:hover .box, .start-opt:focus-visible .box { border-color: var(--border-strong); }
.start-opt:hover .go, .start-opt:focus-visible .go { color: var(--accent); transform: translateX(3px); }
.start-note { margin: 6px 0 0 64px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r-l); font: var(--mono-w) 12px/1.7 var(--mono); color: var(--muted); }
.start-note b { color: var(--text); font-weight: 550; }
.start-note a { color: var(--accent); }
.start-legal { margin: 16px 0 0 64px; font: 11px var(--mono); color: var(--faint); }
.start-legal a { color: var(--faint); }

/* ---------- today cell: ticker line, robot, their on/off buttons ---------- */
.toggles { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; }
.toggles .ib { width: 26px; height: 26px; color: var(--faint); }
.toggles .ib[aria-pressed="true"] { color: var(--muted); }
.toggles .ib[aria-pressed="false"] svg { opacity: .5; }
.collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .28s ease, opacity .2s ease; }
.collapse > div { min-height: 0; overflow: hidden; }
.collapse.off { grid-template-rows: 0fr; opacity: 0; }
.ticker { display: block; width: 100%; text-align: left; padding: 2px 18px 0; font: var(--mono-w) 12.5px/23px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 23px; }
.ticker:hover { color: var(--muted); }
.ticker .lbl { color: var(--accent); }
.ticker .caret { width: 7px; height: 13px; margin-left: 2px; }
.bot { margin-left: auto; width: 34px; height: 34px; margin-block: -8px -4px; color: var(--text); position: relative; flex: none; transition: opacity .25s, transform .25s; }
.bot svg { width: 34px; height: 34px; overflow: visible; }
.bot .whole, .bot .head, .bot .eyes, .bot .eye, .bot .armL, .bot .armR, .bot .bulb { transform-box: fill-box; }
.bot .whole { transform-origin: 50% 100%; }
.bot .head { transform-origin: 50% 90%; transition: transform .3s ease; }
.bot .eyes { transform-origin: center; transition: transform .12s ease-out; }
.bot .eye { fill: var(--accent); transform-origin: center; }
.bot .bulb { fill: var(--accent); transform-origin: center; }
.bot .armL { transform-origin: 100% 0%; transition: transform .2s ease; }
.bot .armR { transform-origin: 0% 0%; transition: transform .2s ease; }
.bot .shut { display: none; }
.bot.sleep .eye, .bot.cover .eye { display: none; }
.bot.sleep .shut { display: inline; }
.bot.blink .eye { animation: blink .16s ease-in-out; }
@keyframes blink { 50% { transform: scaleY(.1); } }
.bot.wave .armR { animation: wave .9s ease-in-out; }
@keyframes wave { 0%, 100% { transform: rotate(0); } 20%, 60% { transform: rotate(-130deg); } 40%, 80% { transform: rotate(-95deg); } }
.bot.hop .whole { animation: hop .5s cubic-bezier(.3, 0, .3, 1); }
@keyframes hop { 0%, 100% { transform: none; } 15% { transform: scale(1.08, .9); } 45% { transform: translateY(-7px) scale(.96, 1.06); } 75% { transform: scale(1.06, .94); } }
.bot.spin .whole { animation: spin .8s cubic-bezier(.4, 0, .2, 1); }
@keyframes spin { 0% { transform: none; } 30% { transform: translateY(-8px); } 70% { transform: translateY(-8px) rotate(360deg); } 100% { transform: rotate(360deg); } }
.bot.tilt .head { transform: rotate(-12deg); }
.bot.bob .whole { animation: bob .3s ease-in-out; }
@keyframes bob { 50% { transform: translateY(1.5px); } }
.bot.cover .armL { transform: rotate(-150deg) translate(1px, -1px); }
.bot.cover .armR { transform: rotate(150deg) translate(-1px, -1px); }
.bot.dizzy .head { animation: wobble .25s ease-in-out 6; }
.bot.dizzy .eye { animation: squash .5s linear 3; }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
@keyframes squash { 50% { transform: scale(.4); } }
.bot.spark .bulb { animation: bulb .6s ease-out; }
@keyframes bulb { 40% { transform: scale(2.2); opacity: .6; } }
.bot.peek .whole { animation: peek 1.4s ease-in-out; }
@keyframes peek { 0%, 100% { transform: none; } 30%, 70% { transform: translateY(11px); } }
.bot.stretch .whole { animation: stretch .9s ease-in-out; }
@keyframes stretch { 0%, 100% { transform: none; } 40%, 60% { transform: scale(.92, 1.14); } }
.bot.stretch .armL { animation: armL .9s ease-in-out; }
.bot.stretch .armR { animation: armR .9s ease-in-out; }
@keyframes armL { 40%, 60% { transform: rotate(-120deg); } }
@keyframes armR { 40%, 60% { transform: rotate(120deg); } }
.bot.pop .whole { animation: botpop .6s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes botpop { from { transform: translateY(14px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.bot .z { position: absolute; left: 26px; top: -6px; font: 600 10px var(--mono); color: var(--muted); pointer-events: none; animation: float 2.4s ease-out forwards; }
@keyframes float { from { opacity: 0; transform: translate(0, 4px); } 20% { opacity: 1; } to { opacity: 0; transform: translate(10px, -14px); } }
.bot .bit { position: absolute; left: 15px; top: 8px; width: 5px; height: 5px; border-radius: 1px; background: var(--accent); pointer-events: none; animation: burst .9s ease-out forwards; }
@keyframes burst { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(180deg); } }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }
@keyframes popin { from { opacity: 0; transform: translateY(4px) scale(.98); } }
@keyframes slidein { from { opacity: 0; transform: translateX(-8px); } }
@keyframes sweep { from { transform: scaleY(0); } }
.cell.new, .start > * { animation: rise .28s ease-out both; }
.start > :nth-child(2) { animation-delay: .05s; } .start > :nth-child(3) { animation-delay: .1s; } .start > :nth-child(4) { animation-delay: .15s; }
.cell.run .box::after { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px; border-radius: 2px; background: var(--accent); transform-origin: top; animation: sweep .5s ease-out both; }
.panel:not([hidden]) { animation: slidein .18s ease-out; }
.scrim.show, .modal:not([hidden]), .palette:not([hidden]) { animation: fade .16s ease-out; }
.modal:not([hidden]) .dialog, .palette:not([hidden]) .pal { animation: popin .18s ease-out; }
/* switching themes crossfades instead of flashing */
.theming, .theming * { transition: background-color .35s ease, border-color .35s ease, color .35s ease, box-shadow .35s ease !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- pairing ---------- */
.qr-wrap { display: flex; justify-content: center; padding: 10px 8px 2px; }
#qr { background: #fff; padding: 10px; border-radius: 10px; min-height: 60px; }
#qr img, #qr canvas { display: block; }

/* ---------- command palette ---------- */
.palette { position: fixed; inset: 0; z-index: 55; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0; background: rgba(10, 12, 16, .3); }
.palette[hidden] { display: none; }
.pal { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 24px 70px rgba(0,0,0,.35); overflow: hidden; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 48px; border-bottom: 1px solid var(--border); color: var(--accent); font: 600 15px var(--mono); }
.pal-in input { flex: 1; border: 0; outline: none; background: transparent; font: 14px var(--mono); color: var(--text); }
.pal-list { max-height: 320px; overflow-y: auto; padding: 6px; }
.pal-item { display: grid; grid-template-columns: 110px 1fr; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; border-radius: var(--r-s); font: 12.5px var(--mono); }
.pal-item b { font-weight: 500; color: var(--accent); }
.pal-item span { color: var(--muted); }
.pal-item.on { background: var(--accent-soft); }
.pal-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); font: 10.5px var(--mono); color: var(--faint); background: var(--code); }

/* ---------- small screens ---------- */
.btn { white-space: nowrap; }
.scrim { display: none; }
.touch-only { display: none; }

@media (max-width: 900px) {
  .panel { position: fixed; top: 44px; bottom: calc(26px + env(safe-area-inset-bottom)); left: 48px; z-index: 20; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .scrim.show { display: block; position: fixed; inset: 44px 0 0 48px; background: rgba(8, 10, 14, .45); z-index: 19; }
  .wordmark, .sb-hide { display: none; }
}
@media (max-width: 600px) {
  .cells { padding: 16px 12px 40vh 4px; }
  .cell { grid-template-columns: 34px 1fr; }
  .prompt { font-size: 10px; padding-right: 6px; }
  .banner, .add-cell, .start-note, .start-legal { margin-left: 34px; width: calc(100% - 34px); }
  .ticker { white-space: normal; line-height: 1.6; padding: 4px 12px 0; }
  .start { margin-top: 4vh; }
  .head { padding-left: 12px; } .md, .ed { padding-left: 12px; padding-right: 12px; }
  .out, .code-line { padding-left: 12px; padding-right: 12px; }
  .cell.status .code-line { padding-right: 84px; }
  .out .k { display: block; min-width: 0; margin-top: 6px; line-height: 1.4; }
  .kernel span, .tb-hide { display: none; }
  .panel { width: calc(100vw - 48px); }
}

/* touch devices (iPad, tablets, phones): no hover, bigger targets, no keyboard hints */
@media (hover: none) and (pointer: coarse) {
  .actions { opacity: 1; }
  .ib { width: 38px; height: 38px; }
  .rail .ib { width: 40px; height: 40px; }
  .row { padding: 10px 8px; }
  .moodseg button { padding: 8px 12px; }
  .ed-foot .hint, .add-cell kbd, .kb-only { display: none; }
  .touch-only { display: inline; }
  /* iOS zooms into any field under 16px — keep inputs at 16px */
  .f-body, .f-tags, .f-date, .f-time, .p-filter input, #palInput, #newJournal { font-size: 16px; }
  .btn { height: 34px; }
  .toggles .ib { width: 34px; height: 34px; }
  .heat { grid-template-rows: repeat(7, 10px); }
  .heat i { width: 10px; height: 10px; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="menubar">
    <div class="logo"><span>d/</span></div>
    <div class="wordmark">daycell<i>.md</i></div>
    <div class="filetab" id="filetab" title="Current journal file"><span id="fileIcon"></span><b id="fname">not linked</b><i class="mod"></i></div>
    <button class="ib" id="ejectBtn" title="Eject journal" hidden></button>
    <div class="grow"></div>
    <div class="kernel" id="kernel"><i class="led"></i><span>idle</span></div>
    <button class="ib" id="themeBtn" title="Toggle theme"></button>
  </header>

  <div class="work">
    <nav class="rail">
      <button class="ib" data-panel="contents" title="Contents"></button>
      <button class="ib" data-panel="trash" title="Trash"></button>
      <button class="ib" data-panel="insights" title="Insights"></button>
      <button class="ib" data-panel="files" title="File & shortcuts"></button>
    </nav>
    <section class="panel" id="panel"></section>
    <div class="scrim" id="scrim"></div>
    <main>
      <div class="toolbar">
        <button class="ib" id="tbNew" title="New entry (b)"></button>
        <button class="ib" id="tbSave" title="Save to file (ctrl+s)"></button>
        <span class="sep"></span>
        <button class="ib" id="tbEdit" title="Edit selected (enter)"></button>
        <button class="ib" id="tbRun" title="Commit cell (shift+enter)"></button>
        <button class="ib danger" id="tbTrash" title="Move selected to trash (d d)"></button>
        <span class="sep"></span>
        <button class="ib" id="tbCmd" title="Command palette (/)"></button>
        <span class="sep tb-hide"></span>
        <span class="mono tb-hide" style="font-size:11.5px;color:var(--faint)">markdown</span>
        <span class="grow"></span>
        <span class="mode" id="mode">COMMAND</span>
      </div>
      <div class="nb" id="nb"><div class="cells" id="cells"></div></div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="sbMode">mode <b>command</b></span>
    <span id="sbCount"></span>
    <span id="sbTrash"></span>
    <span id="sbWords" class="sb-hide"></span>
    <span class="grow"></span>
    <span class="sb-hide">markdown · utf-8</span>
    <span id="sbFile"></span>
  </footer>
</div>

<div class="palette" id="palette" hidden>
  <div class="pal" role="dialog" aria-label="Command palette">
    <div class="pal-in">/<input id="palInput" placeholder="type a command…" autocomplete="off" spellcheck="false"></div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot"><span>↑↓ navigate</span><span>enter run</span><span>esc close</span></div>
  </div>
</div>
<input type="file" id="uploadInput" accept=".md,.markdown,text/markdown,text/plain" hidden>
<input type="file" id="importInput" accept=".zip,.json,application/zip,application/json" hidden>
<div class="toast" id="toast"><span></span><button>undo</button></div>
<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div class="m-input" id="mInputWrap" hidden><input id="mInput" autocomplete="off" spellcheck="false"><span>.md</span></div>
    <div class="d-foot"><button class="btn ghost" id="mCancel">cancel</button><button class="btn" id="mOk">ok</button></div>
  </div>
</div>

<script>

const HEAD_RE = /^##\s+(\d{4}-\d{2}-\d{2})(?:\s*[·|]\s*(\d{1,2}:\d{2}))?(?:\s*[—–-]\s*(.*?))?\s*$/;

  for (const line of text.replace(/\r\n?/g, '\n').split('\n')) {
    if (TRASH_RE.test(line)) { inTrash = true; cur = null; continue; }
    const m = line.match(HEAD_RE);
    if (m) {
      const title = (m[3] || '').trim();
      cur = { id: uid(), date: m[1], time: m[2] ? m[2].padStart(5, '0') : '', title: title === 'Untitled' ? '' : title,
              mood: '', tags: [], deleted: inTrash ? stamp() : '', raw: [] };
      entries.push(cur);
    } else if (cur) cur.raw.push(line);
    else if (!inTrash) {
      const st = line.match(/^<!--\s*\w+:saved (\S+)\s*-->$/);
      if (st) savedStamp = st[1]; else pre.push(line);
    }
  }
  for (const e of entries) {
    let i = 0;
    while (i < e.raw.length && !e.raw[i].trim()) i++;
    for (; i < e.raw.length; i++) {
      const mm = e.raw[i].match(/^(mood|tags|deleted)::\s*(.*)$/i);
      if (!mm) break;
      const k = mm[1].toLowerCase(), v = mm[2].trim();
      if (k === 'mood') e.mood = MOODS.find(x => v.toLowerCase().includes(x)) || '';
      else if (k === 'tags') e.tags = parseTags(v);
      else if (e.deleted) e.deleted = v;
    }
    e.body = stripRule(e.raw.slice(i).join('\n'));

  if (e.deleted) s += `deleted:: ${e.deleted}\n`;

    if (/^```/.test(l)) {

      while (i < L.length && !/^```/.test(L[i])) code.push(L[i++]);
      i++; out += `<pre><code>${esc(code.join('\n'))}</code></pre>`; continue;
    }

async function openUploaded(file) {
  const parsed = parse(await file.text());
  let name = safeName(file.name);
  // browsers rename repeat downloads to "journal (1).md"; catch someone opening a stale copy
  const known = (readJson('exports') || {})[name];
  if (known && parsed.savedStamp && parsed.savedStamp < known &&
      !await ask('Older copy?', `This copy of ${name} was saved ${fmtStamp(parsed.savedStamp)}, but you downloaded a newer one ${fmtStamp(known)}. Open this older copy anyway?`, 'open anyway')) return;
  if (!parsed.entries.length && file.size > 0 &&
      !await ask('No entries found', `${file.name} doesn't contain any ${APP.name} entries. Open it anyway? New entries will be added to it.`, 'open anyway')) return;
  await settle();
  // opening a file that's already in this browser replaces that copy; anything else gets its own name
  const open = getMount();
  if (!(open && open.kind === 'browser' && open.name === name)) name = uniqueName(name);
  Object.assign(state, parsed, { selectedId: null, editingId: null, error: '', pending: null, purged: new Set() });
  setMount({ name, kind: 'browser', downloadedHash: null, lastDownload: parsed.savedStamp || new Date().toISOString() });
  state.target = browserTarget(name);
  await writeFile();
  setMount({ ...getMount(), downloadedHash: hash(serialize()) });
  askPersist();
  track('journal-open');
  const l = live();
  state.selectedId = l.length ? l[l.length - 1].id : null;
  renderAll();
  $('#nb').scrollTop = $('#nb').scrollHeight;
  toast(`opened ${name} · ${l.filter(hasContent).length} entries`);
}

function downloadMd() {
  const m = getMount();
  if (!m || !state.target) return;
  exitEdit(false);
  const savedAt = new Date().toISOString();
  let md = serialize();
  const tag = `<!-- ${STORE_KEY}:saved ${savedAt} -->\n`;
  md = /^# .*\n/.test(md) ? md.replace(/^(# .*\n)/, '$1' + tag) : tag + md;
  const url = URL.createObjectURL(new Blob([md], { type: 'text/markdown;charset=utf-8' }));
  Object.assign(document.createElement('a'), { href: url, download: m.name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  Object.assign(m, { downloadedHash: hash(serialize()), lastDownload: savedAt });
  setMount(m);
  writeJson('exports', { ...(readJson('exports') || {}), [m.name]: savedAt });
  renderAll();
  return md;
}

async function eject() {
  const m = getMount();
  if (!m || !(state.target || state.pending)) return;
  exitEdit(false);
  const isLive = m.kind === 'handle';
  const ok = await ask(`Eject ${m.name}?`, isLive
    ? `${m.name} stays in its folder on your device. ${APP.name} will forget it in this browser until you open it again.`
    : `${m.name} will download to your device and be cleared from this browser. To keep writing later, open it again from your downloads.`,
    'eject');
  if (!ok) return;
  let size = 0;
  if (isLive && state.target) { await writeFile(); size = serialize().length; }
  else if (!isLive) size = (downloadMd() || '').length;
  const n = live().filter(hasContent).length;
  const snap = { md: serialize(), mount: getMount(), target: state.target, pending: state.pending, handle: state.target && state.target.handle };
  // forget the journal in this browser
  Object.assign(state, { target: null, pending: null, entries: [], preamble: DEFAULT_PREAMBLE, selectedId: null, editingId: null, error: '' });
  setMount(null);
  if (!isLive) forgetJournal(m.name);
  store.del(STORE_KEY + '-md');
  if (isLive) idb('readwrite', s => s.delete('handle')).catch(() => {});
  if (NARROW.matches) state.panel = null;
  renderAll();
  playEject(m.name, n, size);
  toast(isLive ? `${m.name} ejected. it's safe in its folder.` : `${m.name} ejected to your downloads.`, () => {
    Object.assign(state, parse(snap.md), { target: snap.target, pending: snap.pending });
    setMount(snap.mount);
    store.set(STORE_KEY + '-md', snap.md);
    if (snap.handle) saveHandle(snap.handle);
    if (snap.target) writeFile();
    renderAll();
    $('#nb').scrollTop = $('#nb').scrollHeight;
    toast('un-ejected. welcome back.');
  }, 9000);
}

async function switchServerFile(name, { create = false } = {}) {

function newEntry(prompt, tpl) {

function startEdit(id) {

  exitEdit(false);

function syncEditor() {
  const e = byId(state.editingId), c = state.editingId && cellEl(state.editingId);
  if (!e || !c) return e;
  e.title = c.querySelector('.f-title').value;
  e.body = c.querySelector('.f-body').value;
  e.tags = parseTags(c.querySelector('.f-tags').value);
  const d = c.querySelector('.f-date').value, t = c.querySelector('.f-time').value;
  if (d) e.date = d;

function exitEdit(render = true) {
  if (!state.editingId) return;
  const e = syncEditor();
  const snap = state.snapshot;
  const before = e ? computeStats(e.id).streak : 0;
  state.editingId = null;
  state.snapshot = null;
  if (e) {
    e.title = e.title.trim();
    // a template nobody filled in isn't an entry
    const untouchedTemplate = e.tpl && snap && e.title === snap.title.trim() && e.body.trim() === snap.body.trim();
    delete e.fresh; delete e.tpl;
    if (!hasContent(e) || untouchedTemplate) {
      state.entries = state.entries.filter(x => x !== e);
      if (state.selectedId === e.id) state.selectedId = null;
    } else if (snap) {
      const changed = ['title', 'body', 'mood', 'date', 'time'].some(k => (snap[k] || '').trim() !== (e[k] || '').trim())
        || snap.tags.join() !== e.tags.join();
      const isNew = snap.fresh || (!snap.title.trim() && !snap.body.replace(/^>.*\n*/, '').trim());
      const after = computeStats().streak;
      if (isNew && live().filter(hasContent).length === 1) track('first-entry');
      if (changed || isNew) state.flashId = e.id;
      if (isNew && after > before && VOICE.milestones[after]) { toast(VOICE.milestones[after]); botCheer(); }
      else if (changed) { toast(pick(isNew ? VOICE.commit : VOICE.edited)); botCommit(); }
    }
  }
  writeFile();
  if (render) { renderAll(); scrollToSelected(); }
}

function revert() {
  const e = byId(state.editingId);
  if (e && state.snapshot) Object.assign(e, state.snapshot);
  state.editingId = null;
  state.snapshot = null;
  if (e && !hasContent(e)) state.entries = state.entries.filter(x => x !== e);
  writeFile(); renderAll();
}

let undoFn = null;
function trash(id) {
  const e = byId(id);
  if (!e) return;
  if (state.editingId === id) { syncEditor(); state.editingId = null; state.snapshot = null; }
  const l = live().filter(x => hasContent(x) || x.id === id), i = l.findIndex(x => x.id === id);
  const next = l[i + 1] || l[i - 1];
  if (!hasContent(e)) {
    state.entries = state.entries.filter(x => x !== e);
    state.selectedId = next ? next.id : null;
    writeFile(); renderAll();
    return;
  }
  e.deleted = stamp();
  state.selectedId = next ? next.id : null;
  writeFile(); renderAll();
  bot('cover', 1300);
  toast(pick(VOICE.trash), () => { e.deleted = ''; state.selectedId = e.id; writeFile(); renderAll(); scrollToSelected(); });
}
function restore(id) {
  const e = byId(id);
  if (!e) return;
  e.deleted = '';
  state.selectedId = e.id;

}
async function purge(id) {
  const e = byId(id);

  if (!await ask('Delete forever?', `“${e.title || 'untitled'}” (${e.date}) will be removed from the file permanently. This can't be undone.`, 'delete forever', 'danger')) return;
  state.purged.add(entrySig(e));
  state.entries = state.entries.filter(x => x !== e);

async function emptyTrash() {

  if (!await ask('Empty trash?', `${n} ${n === 1 ? 'entry' : 'entries'} will be permanently removed from the file. This can't be undone.`, 'empty trash', 'danger')) return;
  state.entries.filter(e => e.deleted).forEach(e => state.purged.add(entrySig(e)));
  state.entries = state.entries.filter(e => !e.deleted);

  '01-01': '1983: the internet switched over to tcp/ip.', '01-09': '2007: the iphone was announced.', '01-15': '2001: wikipedia went live.',
  '02-04': '2004: facebook launched.', '02-12': '1809: charles darwin was born.', '03-10': '1876: the first telephone call.',
  '03-12': '1989: tim berners-lee proposed the world wide web.', '03-14': '1879: albert einstein was born.', '03-21': '2006: the first tweet.',
  '04-03': '1973: the first handheld mobile phone call.', '04-12': '1961: yuri gagarin became the first person in space.',
  '04-23': '1616: william shakespeare died.', '05-11': '1997: deep blue beat garry kasparov at chess.', '05-25': '1977: star wars opened in cinemas.',
  '06-23': '1912: alan turing was born.', '06-29': '2007: the first iphone went on sale.', '07-16': '1969: apollo 11 launched.',
  '07-20': '1969: the first moon landing.', '08-06': '1991: the first website went public.', '08-25': '1991: linus torvalds announced linux.',
  '09-04': '1998: google was founded.', '09-09': '1947: the first computer bug was logged. it was a moth.', '10-04': '1957: sputnik 1 launched.',
  '10-13': '1884: greenwich was chosen as the prime meridian.', '10-14': '1066: the battle of hastings.', '10-29': '1969: the first message crossed the arpanet.',

  '12-10': '1815: ada lovelace was born.', '12-17': '1903: the wright brothers’ first flight.',
};
const TK = { pool: null, i: -1, text: '', shown: 0, timer: 0, hold: 0, hover: false };
function tickerPool() {
  if (TK.pool) return TK.pool;
  const lines = TICKER.slice();
  for (let i = lines.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [lines[i], lines[j]] = [lines[j], lines[i]]; }
  const otd = ON_THIS_DAY[now().date.slice(5)];
  return (TK.pool = otd ? ['on this day, ' + otd, ...lines] : lines);
}
function tickerHtml() {
  if (!TK.text) return '';
  return `<span class="lbl"># </span>${esc(TK.text.slice(0, TK.shown))}${TK.shown < TK.text.length ? '<span class="caret"></span>' : ''}`;
}
function paintTicker() { const el = $('#ticker'); if (el) el.innerHTML = tickerHtml(); }
// types the next line out, holds it for 12 s, then moves on; it waits while you write or hover it
function nextLine() {
  clearInterval(TK.timer); clearTimeout(TK.hold);
  if (!tickerOn()) return;
  const pool = tickerPool();
  TK.i = (TK.i + 1) % pool.length;
  TK.text = pool[TK.i];
  TK.shown = REDUCED.matches ? TK.text.length : 0;
  paintTicker();
  TK.timer = setInterval(() => {
    if (TK.hover || state.editingId || document.hidden || !$('#ticker')) return;
    if (TK.shown < TK.text.length) { TK.shown++; paintTicker(); return; }
    clearInterval(TK.timer);
    holdLine();
  }, 24);
}
function holdLine() { clearTimeout(TK.hold); TK.hold = setTimeout(() => (TK.hover || state.editingId ? holdLine() : nextLine()), 12000); }
function toggleTicker() {
  const on = !tickerOn();
  store.set(STORE_KEY + '-ticker', on ? 'on' : 'off');
  const w = $('#tickWrap'), b = $('[data-act="toggleTicker"]');
  if (w) w.classList.toggle('off', !on);
  if (b) b.setAttribute('aria-pressed', on);
  if (on) nextLine(); else { clearInterval(TK.timer); clearTimeout(TK.hold); }
  if (state.panel === 'files') renderPanelBody();
  toast(on ? 'ticker on.' : 'ticker off. it stays off on this device.');
}

const BOT_SVG = `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <g class="whole"><g class="head">
    <path d="M16 7.5V4.2"/><circle class="bulb" cx="16" cy="3" r="1.7" stroke="none"/>
    <rect x="7.5" y="7.5" width="17" height="12" rx="4"/>
    <g class="eyes"><rect class="eye" x="11.3" y="11.6" width="2.6" height="3.4" rx="1.3" stroke="none"/><rect class="eye" x="18.1" y="11.6" width="2.6" height="3.4" rx="1.3" stroke="none"/><path class="shut" d="M11 13.6h3.2M17.8 13.6H21"/></g>
    <path d="M14.5 17h3"/>
  </g><rect x="11" y="21" width="10" height="7.5" rx="2.2"/><path class="armL" d="M11 23.2 7.4 26"/><path class="armR" d="M21 23.2 24.6 26"/></g></svg>`;
const BOT = { busy: false, asleep: false, idleAt: Date.now(), shuffles: 0, typed: 0, zz: 0 };
// play one move; runs a beat later so it lands on the cell after any re-render
function bot(move, ms = 600, then) {
  setTimeout(() => {
    const b = $('#bot');
    if (!b || !botOn()) return;
    wakeBot();
    b.classList.remove(move); void b.offsetWidth; b.classList.add(move);
    BOT.busy = true;
    setTimeout(() => { const c = $('#bot'); if (c) c.classList.remove(move); BOT.busy = false; if (then) then(); }, ms);
  }, 30);
}
function botFloat(text) {
  const b = $('#bot'); if (!b) return;
  const z = Object.assign(document.createElement('span'), { className: 'z', textContent: text });
  b.append(z); setTimeout(() => z.remove(), 2400);
}
function botConfetti() {
  setTimeout(() => {
    const b = $('#bot'); if (!b || REDUCED.matches) return;
    for (let i = 0; i < 12; i++) {
      const s = Object.assign(document.createElement('span'), { className: 'bit' }), a = i / 12 * Math.PI * 2;
      s.style.setProperty('--dx', Math.cos(a) * (18 + Math.random() * 14) + 'px');
      s.style.setProperty('--dy', Math.sin(a) * (16 + Math.random() * 12) - 6 + 'px');
      s.style.opacity = [1, .3, .55, .78][i % 4];  // the activity grid's shades
      b.append(s); setTimeout(() => s.remove(), 950);
    }
  }, 380);
}
function sleepBot() {
  const b = $('#bot'); if (!b) return;
  BOT.asleep = true; b.classList.add('sleep'); botFloat('z');
  clearInterval(BOT.zz); BOT.zz = setInterval(() => (BOT.asleep ? botFloat('z') : clearInterval(BOT.zz)), 2200);
}
function wakeBot() {
  BOT.idleAt = Date.now();
  if (!BOT.asleep) return;
  BOT.asleep = false; clearInterval(BOT.zz);
  const b = $('#bot'); if (b) b.classList.remove('sleep');
}
const QUIRKS = [
  () => bot('spin', 800), () => { bot('spark', 600); botFloat('*'); }, () => bot('peek', 1400),
  () => { bot('hop', 500); botFloat('♪'); }, () => bot('stretch', 900), () => bot('wave', 900),
];
const pokeBot = () => { if (!BOT.busy) pick(QUIRKS)(); };
const botCommit = () => bot('hop', 500, () => bot('spark', 600));
const botCheer = () => { bot('spin', 800); botConfetti(); };
function botIdle() {
  setTimeout(botIdle, 2600 + Math.random() * 3200);
  const b = $('#bot');
  if (!b || BOT.busy || BOT.asleep || document.hidden) return;
  if (Date.now() - BOT.idleAt > 180000) return sleepBot();  // 3 minutes untouched
  const r = Math.random();
  if (r < .7) bot('blink', 160);
  else if (r < .85) { b.classList.add('tilt'); setTimeout(() => { const c = $('#bot'); if (c) c.classList.remove('tilt'); }, 1300); }
  else { const e = b.querySelector('.eyes'); e.style.transform = `translate(${Math.random() < .5 ? -1.6 : 1.6}px, 0)`; setTimeout(() => { e.style.transform = ''; }, 900); }
}
let eyeFrame = 0;
document.addEventListener('pointermove', ev => {
  wakeBot();
  if (eyeFrame) return;
  eyeFrame = requestAnimationFrame(() => {
    eyeFrame = 0;
    const b = $('#bot'); if (!b || BOT.busy) return;
    const r = b.getBoundingClientRect(), dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1;
    const k = d > 420 ? 0 : Math.min(1, d / 120);
    b.querySelector('.eyes').style.transform = k ? `translate(${dx / d * 1.7 * k}px, ${dy / d * 1.2 * k}px)` : '';
  });
}, { passive: true });
document.addEventListener('keydown', wakeBot, true);
function toggleBot() {
  const on = !botOn();
  store.set(STORE_KEY + '-bot', on ? 'on' : 'off');
  renderCells();
  if (state.panel === 'files') renderPanelBody();
  if (on) bot('pop', 600, () => bot('wave', 900));
  toast(on ? 'robot on. it missed you.' : 'robot off. it stays off on this device.');
}
function startToday() {
  nextLine();
  botIdle();
  setTimeout(() => bot('pop', 600, () => bot('wave', 900)), 500);
}

/* ============ rendering ============ */
const cellEl = id => document.querySelector(`#cells .cell[data-id="${id}"]`);
const matches = (e, q) => [e.title, e.body, e.tags.map(t => '#' + t).join(' '), e.mood, e.date].join(' ').toLowerCase().includes(q);
const meter = m => {
  const lv = MOODS.indexOf(m) + 1;
  return `<span class="meter" title="mood: ${m}">${MOODS.map((_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}<em>${m}</em></span>`;
};

function renderCells() {
  const box = $('#cells');
  const q = state.query.trim().toLowerCase();
  const l = live();
  let html = '';
  if (state.pending) html += `<div class="banner">${I('link', 14)}<span>${esc(state.pending.name)} needs permission to sync</span><span class="grow"></span><button class="btn primary" data-act="reconnect">reconnect</button></div>`;
  else if (!state.target && state.unpaired) html += `<div class="banner">${I('link', 14)}<span>this device isn't paired yet. on your PC, start ${esc(APP.name)} with the <b>iPad &amp; tablet</b> launcher and scan the QR code in the folder panel.</span></div>`;
  else if (!state.target) { box.innerHTML = startHtml(); return; }
  else if (notDownloaded() && daysSinceDownload() >= 3) {
    const d = Math.floor(daysSinceDownload());
    html += `<div class="banner">${I('download', 14)}<span>${esc(state.target.name)} lives in this browser and hasn't been downloaded in ${d} days. keep a copy on your device.</span><span class="grow"></span><button class="btn primary" data-act="download">download copy</button></div>`;
  }
  else if (safariWarning()) {
    html += `<div class="banner">${I('download', 14)}<span>${IOS
      ? `Safari can clear journals kept in the browser if you don't open ${esc(APP.name)} for 7 days. tap share → <b>add to home screen</b> and open it from there to keep it safe, and download a copy now and then.`
      : `Safari can clear journals kept in the browser if you don't open ${esc(APP.name)} for 7 days. download a copy now and then.`}</span><span class="grow"></span><button class="btn" data-act="safariOk">got it</button></div>`;
  }
  if (state.error) html += `<div class="banner">${I('x', 14)}<span>couldn't write ${esc(state.target ? state.target.name : 'file')}: ${esc(state.error)}</span></div>`;
  let n = 0, shown = 0;
  for (const e of l) {
    if (hasContent(e)) n++;
    if (q && e.id !== state.editingId && !matches(e, q)) continue;
    shown++;
    html += cellHtml(e, hasContent(e) ? n : ' ');
  }
  if (!l.length) html += `<div class="empty-nb"><div class="big">empty notebook</div><span class="kb-only">press <kbd>b</kbd> or click below</span><span class="touch-only">tap <b>+ new entry</b> below</span> to write your first entry.<br>everything is saved to one markdown file.</div>`;
  else if (!shown) html += `<div class="empty-nb">no cells match “${esc(state.query)}”</div>`;
  if (!q) html += statusCellHtml();
  if (!q) html += `<button class="add-cell" data-act="new">${I('plus', 14)} new entry <span class="grow"></span><kbd>b</kbd></button>`;
  box.innerHTML = html;
  state.flashId = null;  // the commit sweep plays once
  const ed = state.editingId && cellEl(state.editingId);
  if (ed) { grow(ed.querySelector('.f-body')); countWords(); }
}

function insightsHtml() {
  const s = computeStats();
  if (!s.es.length) return `<div class="p-empty">no data yet.<br>write an entry and this panel<br>starts telling stories.</div>`;
  // activity grid, monday-first columns: 22 weeks, or a full year
  const WEEKS = state.heatYear ? 53 : 22;
  const dow = (new Date(s.today + 'T12:00').getDay() + 6) % 7;
  const start = addDays(s.today, -dow - (WEEKS - 1) * 7);
  let cells = '';
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = addDays(start, i);
    if (d > s.today) { cells += '<i class="pad"></i>'; continue; }
    const w = s.byDay.get(d);
    const lv = w === undefined ? 0 : w < 50 ? 1 : w < 150 ? 2 : w < 300 ? 3 : 4;
    cells += `<i class="${lv ? 'l' + lv : ''}${d === s.today ? ' today' : ''}" ${w !== undefined ? `data-date="${d}"` : ''} title="${d} · ${w === undefined ? 'no entry' : w + ' words'}"></i>`;
  }
  const bars = s.moods.map(m => `<i class="${m ? '' : 'none'}" style="height:${m ? m * 20 : 8}%" title="${m ? MOODS[m - 1] : 'no mood'}"></i>`).join('');
  const maxTag = s.tags.length ? s.tags[0][1] : 1;
  const tags = s.tags.map(([t, c]) => `<div><span class="tag">#${esc(t)}</span><span style="color:var(--faint)">${c}</span><span class="tbar"><i style="width:${c / maxTag * 100}%"></i></span></div>`).join('');
  return `
    <div class="stat-grid">
      <div class="stat${s.streak ? ' hot' : ''}"><b>${s.streak}d</b><span>streak</span></div>
      <div class="stat"><b>${s.longest}d</b><span>longest</span></div>
      <div class="stat"><b>${s.es.length}</b><span>entries</span></div>
      <div class="stat"><b>${s.totalWords >= 10000 ? (s.totalWords / 1000).toFixed(1) + 'k' : s.totalWords.toLocaleString()}</b><span>words</span></div>
    </div>
    <div class="p-group">activity · <button class="seg${WEEKS === 22 ? ' on' : ''}" data-fact="heat22">22 weeks</button> <button class="seg${WEEKS === 53 ? ' on' : ''}" data-fact="heatYear">year</button></div>
    <div class="heat-scroll"><div class="heat">${cells}</div></div>
    <div class="heat-legend">less <i style="background:var(--grid)"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> more</div>
    <div class="stack"><button class="btn block" data-fact="streakCard">${I('image', 14)} share image: my streak</button><button class="btn block" data-fact="yearCard">${I('image', 14)} share image: my year in cells</button></div>
    <div class="p-group">this week</div>
    <div class="kv"><span>entries</span><span>${s.weekEntries}</span><span>words</span><span>${s.weekWords.toLocaleString()}</span><span>status</span><span>${streakLine(s)}</span></div>
    <div class="p-group">mood · last ${s.moods.length} entries</div>
    <div class="bars">${bars}</div>
    ${tags ? `<div class="p-group">top tags</div><div class="taglist">${tags}</div>` : ''}`;
}

function icsFold(line) {
  const out = [];
  while (line.length > 73) { out.push(line.slice(0, 73)); line = ' ' + line.slice(73); }
  return [...out, line].join('\r\n');
}
async function downloadReminder() {
  const t = await ask('Daily reminder', `Pick a time. You'll get a calendar event that repeats every day and links back to ${APP.name}. Open the file to add it to your calendar.`, 'download', '', 'cancel', { input: '21:00', suffix: 'daily' });
  if (!t) return;
  const m = String(t).trim().match(/^(\d{1,2})(?:[:.](\d{2}))?$/);
  if (!m || +m[1] > 23 || +(m[2] || 0) > 59) return toast('use a time like 21:00');
  const hh = pad(+m[1]), mm = pad(+(m[2] || 0));
  const d = new Date(), day = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const utc = d.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const url = location.protocol.startsWith('http') ? location.origin + location.pathname : '';
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${APP.name}//Daily reminder//EN`, 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT', `UID:${uid()}-${utc}@${APP.slug}`, `DTSTAMP:${utc}`, `DTSTART:${day}T${hh}${mm}00`, 'DURATION:PT10M',
    'RRULE:FREQ=DAILY', `SUMMARY:write in ${APP.slug}`,
    `DESCRIPTION:${todaysPrompt(0).replace(/[,;\\]/g, m => '\\' + m)}${url ? '\\n\\n' + url : ''}`,
    ...(url ? [`URL:${url}`] : []),
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:write in ${APP.slug}`, 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].map(icsFold).join('\r\n') + '\r\n';
  saveBlob(new Blob([ics], { type: 'text/calendar;charset=utf-8' }), `${APP.slug}-reminder.ics`);
  track('reminder');
  toast(`reminder for ${hh}:${mm} downloaded. open it to add it to your calendar.`);
}
function saveBlob(blob, name) {

// share images, drawn on a canvas: logo, a headline, numbers and a grid of days. never any entry text.
async function drawCard({ title, sub, weeks, cell, foot }) {
  const s = computeStats();
  try { await Promise.all(['600 20px "JetBrains Mono"', '400 20px "JetBrains Mono"'].map(f => document.fonts.load(f))); } catch {}
  const W = 1200, H = 630, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const accent = (ACCENTS[store.get(STORE_KEY + '-accent')] || ACCENTS.teal)[1];
  const F = (w, n) => `${w} ${n}px "JetBrains Mono", ui-monospace, monospace`;
  g.fillStyle = '#0c0f13'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#171c23';
  for (let x = 0; x < W; x += 24) for (let y = 0; y < H; y += 24) g.fillRect(x, y, 1.5, 1.5);
  g.fillStyle = '#e3e8ee'; g.beginPath(); g.roundRect(72, 64, 48, 48, 11); g.fill();
  g.fillStyle = '#11151b'; g.font = F(600, 22); g.fillText(APP.glyph, 81, 96);
  g.fillStyle = '#e3e8ee'; g.font = F(600, 28); g.fillText(APP.slug, 138, 98);
  g.fillStyle = '#56606d'; g.font = F(400, 28); g.fillText('.md', 138 + g.measureText(APP.slug).width + 2, 98);
  g.fillStyle = '#e3e8ee'; g.font = F(600, 54); g.fillText(title, 72, 200);
  g.fillStyle = '#8b95a3'; g.font = F(400, 24); g.fillText(sub, 72, 250);
  // grid: monday-first columns, today in the last column
  const gap = Math.round(cell / 4), x0 = 72, y0 = 300;
  const dow = (new Date(s.today + 'T12:00').getDay() + 6) % 7;
  const start = addDays(s.today, -dow - (weeks - 1) * 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i);
    if (d > s.today) break;
    const w = s.byDay.get(d);
    const lv = w === undefined ? 0 : w < 50 ? 1 : w < 150 ? 2 : w < 300 ? 3 : 4;
    const x = x0 + Math.floor(i / 7) * (cell + gap), y = y0 + (i % 7) * (cell + gap);
    g.globalAlpha = 1; g.fillStyle = '#171c23';
    g.beginPath(); g.roundRect(x, y, cell, cell, 3); g.fill();
    if (lv) {
      g.globalAlpha = [0, .3, .55, .78, 1][lv]; g.fillStyle = accent;
      g.beginPath(); g.roundRect(x, y, cell, cell, 3); g.fill();
    }
  }
  g.globalAlpha = 1;
  g.fillStyle = '#56606d'; g.font = F(400, 20);
  g.fillText(foot, 72, 566);
  return new Promise(r => c.toBlob(r, 'image/png'));
}

// Day One exports a .zip holding one JSON file per journal: { entries: [{ creationDate, timeZone, text, tags, starred }] }
// Entries are merged into the open journal (or a new one); anything already there (same date + time) is skipped.
async function unzipJson(buf) {
  const v = new DataView(buf), out = [];
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('that zip file looks damaged.');
  let p = v.getUint32(eocd + 16, true);
  const count = v.getUint16(eocd + 10, true);
  for (let n = 0; n < count; n++) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true);
    const nameLen = v.getUint16(p + 28, true), extraLen = v.getUint16(p + 30, true), noteLen = v.getUint16(p + 32, true);
    const local = v.getUint32(p + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nameLen));
    p += 46 + nameLen + extraLen + noteLen;
    if (!/\.json$/i.test(name) || /(^|\/)(__MACOSX|\.)/.test(name)) continue;
    const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
    const raw = new Uint8Array(buf, start, size);
    let bytes;
    if (method === 0) bytes = raw;
    else if (method === 8) bytes = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else continue;
    out.push({ name: name.split('/').pop(), text: new TextDecoder().decode(bytes) });
  }
  return out;
}
function localParts(iso, timeZone) {

      .formatToParts(d).map(x => [x.type, x.value]));
    return { date: `${f.year}-${f.month}-${f.day}`, time: `${f.hour}:${f.minute}` };
  } catch { return { date: isoDate(d), time: `${pad(d.getHours())}:${pad(d.getMinutes())}` }; }
}
